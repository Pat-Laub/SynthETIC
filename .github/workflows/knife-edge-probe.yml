name: Knife-edge qnorm probe

on:
  push:
    branches: [rng-knife-edge-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agi-lab/SynthETIC
          ref: master
          path: upstream
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: upstream/SynthETIC
      - name: Install upstream SynthETIC
        shell: bash
        run: R CMD INSTALL upstream/SynthETIC
      - name: Probe
        shell: Rscript {0}
        run: source("tools/knife_edge_probe.R")
      - name: Reproducer
        shell: Rscript {0}
        run: source("tools/knife_edge_repro.R")
