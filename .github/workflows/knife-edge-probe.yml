name: Knife-edge qnorm probe

on:
  push:
    branches: [rng-knife-edge-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Probe
        shell: Rscript {0}
        run: source("tools/knife_edge_probe.R")
